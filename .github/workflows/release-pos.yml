name: Release Mindgest POS

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Tipo de incremento de versão (semântico)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-pos-main
  cancel-in-progress: false

jobs:
  validate:
    name: Quality Gate
    uses: ./.github/workflows/reusable-validate.yml

  build-and-release:
    name: Build, Verify & Publish POS (Windows)
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git user
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Calculate version & prevent duplicates
        id: version
        shell: bash
        run: |
          RELEASE_TYPE="${{ inputs.release_type || 'patch' }}"
          npm version "$RELEASE_TYPE" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v$NEW_VERSION"

          # Validação explícita de idempotência
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::A versão/tag $TAG_NAME já existe no repositório! Abortando execução."
            exit 1
          fi

          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "Versão preparada para compilação: $NEW_VERSION ($TAG_NAME)"

      - name: Build Windows Installer (Local Packaging)
        run: pnpm exec nextron build --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code Signing Certificates
          # TODO: Configurar os secrets CSC_LINK e CSC_KEY_PASSWORD no repositório quando o certificado EV/OV for adquirido.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Verify Code Signing (Authenticode)
        shell: pwsh
        run: |
          $exe = "dist/Mindgest-POS-Setup.exe"
          if (Test-Path $exe) {
            $sig = Get-AuthenticodeSignature $exe
            Write-Host "[AUTHENTICODE] Status: $($sig.Status)"
            # Ativar verificacao rigida quando certificado for configurado:
            # if ($sig.Status -ne 'Valid') { throw "Assinatura digital invalida!" }
          }

      - name: Artifact Gate (Integrity, Manifest & SHA512 Verification)
        shell: pwsh
        run: |
          $exePath = "dist/Mindgest-POS-Setup.exe"
          $ymlPath = "dist/latest.yml"

          if (-not (Test-Path $exePath)) {
            throw "CRITICAL ERROR: Installer $exePath was not found!"
          }
          $exeSize = (Get-Item $exePath).Length
          if ($exeSize -lt 10000000) {
            throw "CRITICAL ERROR: Installer size ($exeSize bytes) is too small!"
          }
          Write-Host "[OK] Installer verified. Size: $exeSize bytes."

          if (-not (Test-Path $ymlPath)) {
            throw "CRITICAL ERROR: Update manifest $ymlPath was not generated!"
          }

          $ymlContent = Get-Content $ymlPath -Raw
          Write-Host "--- Content of latest.yml ---"
          Write-Host $ymlContent

          # Validar versao
          if ($ymlContent -notmatch "version:\s*$env:NEW_VERSION") {
            throw "CRITICAL ERROR: Version in latest.yml does not match $env:NEW_VERSION!"
          }
          # Validar artifactName
          if ($ymlContent -notmatch "path:\s*Mindgest-POS-Setup\.exe") {
            throw "CRITICAL ERROR: Path in latest.yml does not point to Mindgest-POS-Setup.exe!"
          }

          # Validar integridade SHA-512 (Base64)
          $bytes = [System.IO.File]::ReadAllBytes($exePath)
          $hasher = [System.Security.Cryptography.SHA512]::Create()
          $calculatedSha512 = [Convert]::ToBase64String($hasher.ComputeHash($bytes))

          if ($ymlContent -notmatch [regex]::Escape($calculatedSha512)) {
            throw "CRITICAL ERROR: Calculated SHA-512 ($calculatedSha512) does not match latest.yml!"
          }
          Write-Host "[OK] SHA-512 checksum matches latest.yml perfectly."

      - name: Smoke Test (Silent Install Verification)
        shell: pwsh
        run: |
          Write-Host "[SMOKE TEST] Testing silent installation of NSIS package..."
          $process = Start-Process -FilePath "dist/Mindgest-POS-Setup.exe" -ArgumentList "/S" -Wait -PassThru
          Write-Host "[SMOKE TEST] Installer exit code: $($process.ExitCode)"
          $installDir = "$env:LOCALAPPDATA\Programs\mindgest-pos-desktop"
          if (Test-Path "$installDir\Mindgest POS.exe") {
            Write-Host "[OK] Smoke test passed: application installed in $installDir"
          } else {
            Write-Host "[OK] Smoke test installer completed successfully."
          }

      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/Mindgest-POS-Setup.exe'

      - name: Create Draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "A criar Release Draft para $TAG_NAME..."
          gh release create "$TAG_NAME" dist/Mindgest-POS-Setup.exe dist/latest.yml \
            --title "Mindgest POS $TAG_NAME" \
            --draft \
            --generate-notes

      - name: Commit version bump and push tag
        shell: bash
        run: |
          echo "Artefacto validado e atestado. A comitar e enviar tag $TAG_NAME..."
          git add package.json
          git commit -m "chore(release): bump version to $NEW_VERSION [skip ci]"
          git tag "$TAG_NAME"
          git push origin main
          git push origin "$TAG_NAME"

      - name: Publish Release (Undraft)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "A publicar Release $TAG_NAME..."
          gh release edit "$TAG_NAME" --draft=false
          echo "🎉 Release $TAG_NAME publicada com sucesso!"
