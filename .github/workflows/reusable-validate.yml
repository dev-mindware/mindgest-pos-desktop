name: Reusable Validation & Build Check

on:
  workflow_call:

jobs:
  validate:
    name: Validation & Typecheck (Windows)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Verify Nextron Build (No Packaging)
        run: pnpm exec nextron build --no-pack
